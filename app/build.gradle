static def releaseTime() {
    return new Date().format("yyMMddHH", TimeZone.getTimeZone("GMT+8"))
}

/**
 * versionCode：2020-01-01 00:00 (UTC+8) 起的秒数。
 * - 每秒唯一：同一小时内多次出包也会得到不同 versionCode，App 才能判断"有新版本"；
 *   （旧方案 yyMMddHH 在同一小时内恒定，客户端会把新包误判成"已是最新"）
 * - 随时间单调递增，Int 上限可支撑到 2088 年前后；
 * - 不使用 git 提交计数：历史重置后 rev-list 基线已不在 HEAD 祖先链。
 */
static def versionCodeFromTime() {
    return (int) ((System.currentTimeMillis() - 1577808000000L).intdiv(1000L))
}

def name = "legado"
def version = "3." + releaseTime()
// versionCode：优先取 -PversionCode=xxx 的显式值；否则按上面时间戳生成。
// floor 取本机已安装/已发布的最高包（3.26112214），低于它会被系统判为降级安装而失败。
def versionCodeFloor = 26112214
def versionCodeValue = project.hasProperty("versionCode")
        ? project.property("versionCode").toString().toInteger()
        : versionCodeFromTime()
if (versionCodeValue < versionCodeFloor) {
    versionCodeValue = versionCodeFloor
}
def armOnly = project.findProperty("armOnly")?.toBoolean() ?: false

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "com.legado.app"
        minSdk 23
        targetSdk 36
        versionCode = versionCodeValue
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep app translations while dropping unused transitive dependency locales.
        resourceConfigurations += [
                'en',
                'es-rES',
                'ja-rJP',
                'pt-rBR',
                'vi',
                'zh',
                // AndroidX stores Simplified Chinese switch labels under zh-rCN.
                'zh-rCN',
                'zh-rHK',
                'zh-rTW'
        ]
        project.ext.set("archivesBaseName", name + "_" + version)

        if (armOnly) {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources.excludes.add('META-INF/*')
        // R8 removes the transcode implementation; these bundled resources have no runtime reader.
        resources.excludes.addAll([
                'tables/Transcoder_*.bin',
                '*.proto',
                '**/*.proto',
                'src/**',
                // kotlin-reflect and its builtins loaders are not part of the release runtime.
                'kotlin/*.kotlin_builtins',
                'kotlin/**/*.kotlin_builtins'
        ])
        jniLibs {
            // These dependencies already ship stripped; skip redundant strip attempts.
            keepDebugSymbols += [
                    '**/libandroidx.graphics.path.so',
                    '**/libarchive-jni.so',
                    '**/libdatastore_shared_counter.so',
                    '**/libimage_processing_util_jni.so',
                    '**/librenderscript-toolkit.so',
                    '**/librtmp-jni.so',
                    '**/libsurface_util_jni.so'
            ]
        }
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
        // 内测包用 -PfastRelease 跳过 lintVital：上次出包实测这段分析 4m51，
        // 收尾比 R8 还晚 1m47，一直压在关键路径上。正式发版不要加这个参数。
        checkReleaseBuilds = !project.hasProperty("fastRelease")
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
    testOptions {
        unitTests {
            // 纯 JVM 单测会执行到 android.util.Log，未 mock 时直接抛异常；返回默认值让这些用例跑通
            returnDefaultValues = true
        }
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('debug')) { variant ->
        // 未混淆的 HtmlUnit 含 MethodHandle/VarHandle 调用，D8 要求 min-api 26；
        // release 走 R8 会把这类调用内联掉，故仍保持 23。
        variant.minSdk = 26
    }
}

